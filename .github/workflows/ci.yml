
name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Тестування Beauty Shop
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Налаштувати Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Встановити залежності
        run: npm ci

      - name: Запустити тести
        run: npm test

  build-frontend:
    name: Збірка Docker-образу фронтенду
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Налаштувати Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Зібрати Docker-образ
        uses: docker/build-push-action@v6
        with:
          context: ./public
          file: ./public/Dockerfile
          push: false
          load: true
          tags: beauty-shop-web:${{ github.sha }}

      - name: Зберегти Docker-образ
        run: docker save beauty-shop-web:${{ github.sha }} -o beauty-shop-web.tar

      - name: Завантажити артефакт
        uses: actions/upload-artifact@v4
        with:
          name: beauty-shop-web-image
          path: beauty-shop-web.tar
