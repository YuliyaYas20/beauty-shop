
openapi: 3.0.3
info:
  title: Beauty Shop Catalog API
  version: 1.0.0
  description: REST API для управління каталогом товарів (Практична робота №4).

servers:
  - url: http://localhost:3000
    description: Локальний сервер розробки

tags:
  - name: Items
    description: CRUD-операції для товарів каталогу
  - name: System
    description: Системні ендпоїнти перевірки стану

paths:
  /health:
    get:
      tags:
        - System
      summary: Перевірка стану сервера
      responses:
        "200":
          description: Сервер працює коректно
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /items:
    get:
      tags:
        - Items
      summary: Отримати список усіх товарів
      responses:
        "200":
          description: Список товарів успішно отримано
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductResponse"

    post:
      tags:
        - Items
      summary: Створити новий товар
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Товар успішно створено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Унікальний числовий ідентифікатор товару
        schema:
          type: integer
          minimum: 1
          example: 1

    get:
      tags:
        - Items
      summary: Отримати детальну інформацію про товар за ID
      responses:
        "200":
          description: Товар знайдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          description: Товар не знайдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags:
        - Items
      summary: Оновити дані товару за ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Товар успішно оновлено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          description: Помилка валідації вхідних даних
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Товар не знайдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Items
      summary: Видалити товар за ID
      responses:
        "204":
          description: Товар успішно видалено (без тіла відповіді)
        "404":
          description: Товар не знайдено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    CreateProductRequest:
      type: object
      required:
        - name
        - price
        - stockQuantity
      properties:
        name:
          type: string
          minLength: 1
          example: "Зволожувальний крем для обличчя"
        brand:
          type: string
          nullable: true
          example: "La Roche-Posay"
        category:
          type: string
          nullable: true
          example: "Догляд за обличчям"
        price:
          type: number
          format: float
          minimum: 0
          example: 650.00
        description:
          type: string
          nullable: true
          example: "Інтенсивне зволоження для сухої та чутливої шкіри"
        stockQuantity:
          type: integer
          minimum: 0
          example: 15

    UpdateProductRequest:
      type: object
      required:
        - name
        - price
        - stockQuantity
      properties:
        name:
          type: string
          minLength: 1
          example: "Зволожувальний крем для обличчя (оновлений)"
        brand:
          type: string
          nullable: true
          example: "La Roche-Posay"
        category:
          type: string
          nullable: true
          example: "Догляд за обличчям"
        price:
          type: number
          format: float
          minimum: 0
          example: 690.00
        description:
          type: string
          nullable: true
          example: "Оновлена формула з гіалуроновою кислотою"
        stockQuantity:
          type: integer
          minimum: 0
          example: 20

    ProductResponse:
      type: object
      required:
        - id
        - name
        - price
        - stockQuantity
      properties:
        id:
          type: integer
          minimum: 1
          example: 1
        name:
          type: string
          example: "Зволожувальний крем для обличчя"
        brand:
          type: string
          nullable: true
          example: "La Roche-Posay"
        category:
          type: string
          nullable: true
          example: "Догляд за обличчям"
        price:
          type: number
          format: float
          minimum: 0
          example: 650.00
        description:
          type: string
          nullable: true
          example: "Інтенсивне зволоження для сухої та чутливої шкіри"
        stockQuantity:
          type: integer
          minimum: 0
          example: 15

    ErrorResponse:
      type: object
      required:
        - error
        - code
        - details
      properties:
        error:
          type: string
          example: "ValidationError"
        code:
          type: string
          example: "INVALID_PRODUCT_DATA"
        details:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                example: "price"
              message:
                type: string
                example: "Price must be a non-negative number"
